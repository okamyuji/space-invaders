# 公開から7日未満の版を入れない。依存の乗っ取りへの備え。緊急時だけ minimumReleaseAgeExclude に name@version で1版ずつ足す
minimumReleaseAge: 10080
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  esbuild: ">=0.28.1"
  undici: ^7.29.1
  tinypool: ^2.1.2
  postcss: ">=8.5.23"
# 依存のビルドスクリプトは走らせない。フックは prepare の lefthook install が入れる
allowBuilds:
  lefthook: false
# 7日未満の版の例外。今回の緊急更新で入れた版だけを1版ずつ書く。7日を過ぎたら消してよい
minimumReleaseAgeExclude:
  - "@babel/helper-string-parser@7.29.11"
  - "@babel/parser@7.29.11"
  - "@babel/types@7.29.11"
  - postcss@8.5.31
  - tldts-core@7.4.19
  - tldts@7.4.19
