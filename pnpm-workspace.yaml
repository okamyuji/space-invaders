# 公開から3日未満の版を入れない。依存の乗っ取りへの備え。緊急時だけ minimumReleaseAgeExclude に name@version で1版ずつ足す
minimumReleaseAge: 4320
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  esbuild: ">=0.28.1"
  undici: ^7.29.1
  tinypool: ^2.1.2
  postcss: ">=8.5.23"
# 依存のビルドスクリプトは走らせない。フックは prepare の lefthook install が入れる
allowBuilds:
  lefthook: false
