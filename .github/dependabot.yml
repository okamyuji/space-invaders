version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      # cooldown に満たない版が pnpm の lockfile にあると更新が丸ごと失敗するので、毎日試して回復を早める
      interval: daily
    cooldown:
      default-days: 7
    # major は動きが変わりうるので手で上げる。allow は脆弱性更新まで絞るので使わない
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
