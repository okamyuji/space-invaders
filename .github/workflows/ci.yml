name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Mirror of `lefthook.yml` so the local pre-commit gate and CI run the
# same checks. If you change one, change the other.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/node-ci.yml@v1
    with:
      node-version: "22"
      test-command: "run test:cov"

  # vp fmt --check and vp build are not covered by node-ci.yml inputs,
  # so they stay as a repo-specific job.
  fmt-and-build:
    name: Format check / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm exec vp fmt --check
      - name: Build
        run: pnpm exec vp build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore
